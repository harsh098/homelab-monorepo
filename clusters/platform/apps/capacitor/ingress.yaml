apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: capacitor-platform-home-arpa
  namespace: flux-system
  labels:
    app.kubernetes.io/name: capacitor
    app.kubernetes.io/part-of: platform
spec:
  secretName: capacitor.platform.home.arpa-tls
  issuerRef:
    name: homelab-private-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - capacitor.platform.home.arpa
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 720h
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: capacitor-auth
  namespace: flux-system
  labels:
    app.kubernetes.io/name: capacitor
    app.kubernetes.io/part-of: platform
spec:
  forwardAuth:
    address: http://oauth2-proxy.flux-system.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - Authorization
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: capacitor-auth-errors
  namespace: flux-system
  labels:
    app.kubernetes.io/name: capacitor
    app.kubernetes.io/part-of: platform
spec:
  errors:
    status:
      - "401-403"
    service:
      name: oauth2-proxy
      port: 4180
    query: /oauth2/sign_in
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capacitor
  namespace: flux-system
  labels:
    app.kubernetes.io/name: capacitor
    app.kubernetes.io/part-of: platform
  annotations:
    cert-manager.io/cluster-issuer: homelab-private-ca
    traefik.ingress.kubernetes.io/router.middlewares: flux-system-capacitor-auth-errors@kubernetescrd,flux-system-capacitor-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - capacitor.platform.home.arpa
      secretName: capacitor.platform.home.arpa-tls
  rules:
    - host: capacitor.platform.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capacitor
                port:
                  number: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capacitor-auth
  namespace: flux-system
  labels:
    app.kubernetes.io/name: capacitor
    app.kubernetes.io/part-of: platform
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - capacitor.platform.home.arpa
      secretName: capacitor.platform.home.arpa-tls
  rules:
    - host: capacitor.platform.home.arpa
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
