apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: flux-system
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: capacitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      annotations:
        platform.home.arpa/credential-generation: "2"
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/part-of: capacitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
          imagePullPolicy: IfNotPresent
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://keycloak.platform.home.arpa/realms/Platform
            - --redirect-url=https://capacitor.platform.home.arpa/oauth2/callback
            - --http-address=0.0.0.0:4180
            - --upstream=static://202
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --set-authorization-header=true
            - --pass-authorization-header=true
            - --email-domain=*
            - --allowed-role=capacitor
            - --scope=openid profile email
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-refresh=1h
            - --cookie-expire=8h
            - --skip-provider-button=true
            - --provider-ca-file=/etc/oauth2-proxy/tls/ca.crt
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: capacitor
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: capacitor-oauth2-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: capacitor-oauth2-proxy
                  key: cookie-secret
          volumeMounts:
            - name: keycloak-ca
              mountPath: /etc/oauth2-proxy/tls
              readOnly: true
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      volumes:
        - name: keycloak-ca
          secret:
            secretName: capacitor.platform.home.arpa-tls
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: flux-system
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: capacitor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
      protocol: TCP
