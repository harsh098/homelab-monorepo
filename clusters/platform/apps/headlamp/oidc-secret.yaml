apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-oidc-reader
  namespace: kube-system
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-headlamp
  namespace: kube-system
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: headlamp-oidc-reader
          serviceAccountRef:
            name: headlamp-oidc-reader
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-headlamp
    kind: SecretStore
  target:
    name: headlamp-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: keycloak/clients/headlamp
        property: client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: keycloak/clients/headlamp
        property: client_secret
