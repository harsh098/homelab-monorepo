apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tekton-platform-home-arpa
  namespace: tekton-pipelines
spec:
  secretName: tekton.platform.home.arpa-tls
  issuerRef:
    name: homelab-private-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - tekton.platform.home.arpa
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 720h
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tekton.platform.home.arpa
      secretName: tekton.platform.home.arpa-tls
  rules:
    - host: tekton.platform.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
