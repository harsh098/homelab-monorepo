apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-oidc-reader
  namespace: tekton-pipelines
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-tekton
  namespace: tekton-pipelines
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tekton-oidc-reader
          serviceAccountRef:
            name: tekton-oidc-reader
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tekton-dashboard-oidc-client
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-tekton
    kind: SecretStore
  target:
    name: tekton-dashboard-oidc-client
    creationPolicy: Owner
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: keycloak/clients/tekton-dashboard
        property: client_id
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: keycloak/clients/tekton-dashboard
        property: client_secret
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tekton-dashboard-cookie
  namespace: tekton-pipelines
spec:
  length: 32
  symbols: 0
  secretKeys:
    - OAUTH2_PROXY_COOKIE_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tekton-dashboard-cookie
  namespace: tekton-pipelines
spec:
  refreshPolicy: CreatedOnce
  target:
    name: tekton-dashboard-cookie
    creationPolicy: Orphan
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tekton-dashboard-cookie
