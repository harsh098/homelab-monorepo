apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: tekton-pipelines
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tekton-dashboard-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tekton-dashboard-oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            - --scope=openid profile email
            - --oidc-issuer-url=https://keycloak.platform.home.arpa/realms/Platform
            - --provider-ca-file=/etc/tekton-ca/ca.crt
            - --oidc-groups-claim=groups
            - --allowed-group=kubectl-admin
            - --email-domain=*
            - --redirect-url=https://tekton.platform.home.arpa/oauth2/callback
            - --upstream=http://tekton-dashboard.tekton-pipelines.svc.cluster.local:9097
            - --cookie-secure=true
            - --cookie-name=__Host-tekton_oauth2
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --cookie-refresh=30m
            - --skip-provider-button=true
            - --whitelist-domain=tekton.platform.home.arpa
            - --pass-access-token=false
            - --pass-authorization-header=false
            - --pass-basic-auth=false
            - --pass-user-headers=false
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tekton-dashboard-oidc-client
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tekton-dashboard-oidc-client
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: tekton-dashboard-cookie
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: keycloak-ca
              mountPath: /etc/tekton-ca
              readOnly: true
      volumes:
        - name: keycloak-ca
          secret:
            secretName: tekton.platform.home.arpa-tls
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: tekton-pipelines
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tekton-dashboard-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
