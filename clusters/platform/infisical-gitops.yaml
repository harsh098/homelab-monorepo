apiVersion: v1
kind: Namespace
metadata:
  name: infisical
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-bootstrap
  namespace: infisical
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: infisical-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: infisical-bootstrap
        property: encryption_key
    - secretKey: AUTH_SECRET
      remoteRef:
        key: infisical-bootstrap
        property: auth_secret
    - secretKey: BACKUP_BUCKET
      remoteRef:
        key: infisical-bootstrap
        property: backup_bucket
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: infisical-bootstrap
        property: backup_access_key
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: infisical-bootstrap
        property: backup_secret_key
    - secretKey: SERVICE_ACCOUNT_JSON
      remoteRef:
        key: infisical-bootstrap
        property: service_account_json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: infisical-db
  namespace: infisical
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  bootstrap:
    initdb:
      database: infisical
      owner: infisical
  storage:
    size: 20Gi
    storageClass: local-path
  backup:
    barmanObjectStore:
      destinationPath: s3://hmx-infisical-backups/infisical
      endpointURL: https://storage.googleapis.com
      s3Credentials:
        accessKeyId:
          name: infisical-bootstrap
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: infisical-bootstrap
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
