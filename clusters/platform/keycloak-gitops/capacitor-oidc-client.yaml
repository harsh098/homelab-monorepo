apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: platform-capacitor
  labels:
    app.kubernetes.io/name: capacitor
    app.kubernetes.io/part-of: platform
spec:
  deletionPolicy: Orphan
  forProvider:
    realmId: Platform
    clientId: capacitor
    name: Capacitor
    description: OIDC client for the Capacitor Flux dashboard
    accessType: CONFIDENTIAL
    clientAuthenticatorType: client-secret
    clientSecretSecretRef:
      name: capacitor-oidc-client
      namespace: keycloak
      key: client-secret
    enabled: true
    import: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    baseUrl: https://capacitor.platform.home.arpa
    validRedirectUris:
      - https://capacitor.platform.home.arpa/oauth2/callback
    validPostLogoutRedirectUris:
      - https://capacitor.platform.home.arpa/
    webOrigins:
      - https://capacitor.platform.home.arpa
  providerConfigRef:
    name: platform-keycloak
---
apiVersion: openidgroup.keycloak.crossplane.io/v1alpha1
kind: AudienceProtocolMapper
metadata:
  name: platform-capacitor-audience
spec:
  deletionPolicy: Delete
  forProvider:
    realmId: Platform
    clientIdRef:
      name: platform-capacitor
      policy:
        resolve: Always
    name: capacitor-audience
    includedClientAudience: capacitor
    addToIdToken: true
    addToAccessToken: true
  providerConfigRef:
    name: platform-keycloak
---
apiVersion: openidgroup.keycloak.crossplane.io/v1alpha1
kind: AudienceProtocolMapper
metadata:
  name: platform-kubernetes-audience
spec:
  deletionPolicy: Delete
  forProvider:
    realmId: Platform
    clientId: 9491707e-24f8-4b3c-a46c-2edd922e2b2e
    name: kubernetes-audience
    includedClientAudience: kubernetes
    addToIdToken: true
    addToAccessToken: true
  providerConfigRef:
    name: platform-keycloak
