apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-gitops-reconciler
  namespace: keycloak
data:
  reconcile.py: |
    import json
    import os
    import urllib.error
    import urllib.parse
    import urllib.request

    base = "http://keycloak.keycloak.svc.cluster.local"
    token_request = urllib.parse.urlencode({
        "username": "admin",
        "password": os.environ["KC_ADMIN_PASSWORD"],
        "grant_type": "password",
        "client_id": "admin-cli",
    }).encode()
    token = json.loads(urllib.request.urlopen(urllib.request.Request(
        base + "/realms/master/protocol/openid-connect/token",
        data=token_request,
        headers={"Content-Type": "application/x-www-form-urlencoded"},
    )).read())["access_token"]
    headers = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}

    def call(method, path, body=None):
        request = urllib.request.Request(
            base + path,
            data=None if body is None else json.dumps(body).encode(),
            headers=headers,
            method=method,
        )
        try:
            response = urllib.request.urlopen(request)
            content = response.read()
            return response.status, None if not content else json.loads(content)
        except urllib.error.HTTPError as error:
            if error.code == 404:
                return 404, None
            raise

    def ensure_realm(realm):
        status, _ = call("GET", "/admin/realms/" + realm)
        if status == 404:
            call("POST", "/admin/realms", {"realm": realm, "enabled": True, "displayName": realm})
        status, _ = call("GET", "/admin/realms/" + realm + "/roles/admin")
        if status == 404:
            call("POST", "/admin/realms/" + realm + "/roles", {"name": "admin"})
        status, _ = call("GET", "/admin/realms/" + realm + "/identity-provider/instances/google")
        if status == 404:
            call("POST", "/admin/realms/" + realm + "/identity-provider/instances", {
                "alias": "google",
                "displayName": "Google",
                "providerId": "google",
                "enabled": True,
                "trustEmail": True,
                "config": {
                    "clientId": os.environ["KC_GOOGLE_CLIENT_ID"],
                    "clientSecret": os.environ["KC_GOOGLE_CLIENT_SECRET"],
                    "defaultScope": "openid profile email",
                    "syncMode": "IMPORT",
                },
            })

    for realm in ("Platform", "Homelab"):
        ensure_realm(realm)

    status, users = call("GET", "/admin/realms/Platform/users?" + urllib.parse.urlencode({
        "username": "hmisraji07@gmail.com", "exact": "true",
    }))
    if not users:
        call("POST", "/admin/realms/Platform/users", {
            "username": "hmisraji07@gmail.com",
            "email": "hmisraji07@gmail.com",
            "enabled": True,
            "emailVerified": True,
        })
        _, users = call("GET", "/admin/realms/Platform/users?" + urllib.parse.urlencode({
            "username": "hmisraji07@gmail.com", "exact": "true",
        }))
    user_id = users[0]["id"]
    _, role = call("GET", "/admin/realms/Platform/roles/admin")
    call("POST", "/admin/realms/Platform/users/" + user_id + "/role-mappings/realm", [role])

    status, clients = call("GET", "/admin/realms/Platform/clients?" + urllib.parse.urlencode({
        "clientId": "kubernetes",
    }))
    if not clients:
        call("POST", "/admin/realms/Platform/clients", {
            "clientId": "kubernetes",
            "name": "Kubernetes CLI",
            "enabled": True,
            "publicClient": True,
            "protocol": "openid-connect",
            "standardFlowEnabled": True,
            "directAccessGrantsEnabled": False,
            "redirectUris": ["http://localhost:8000/*", "http://localhost:18000/*"],
            "webOrigins": ["http://localhost:8000", "http://localhost:18000"],
        })
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-gitops-reconciler
  namespace: keycloak
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reconciler
              image: python:3.12-alpine
              command: ["python", "/config/reconcile.py"]
              env:
                - name: KC_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-admin
                      key: password
                - name: KC_GOOGLE_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-google-oauth
                      key: client_id
                - name: KC_GOOGLE_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-google-oauth
                      key: client_secret
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: keycloak-gitops-reconciler
                defaultMode: 0755
