apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-keycloak
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-keycloak:v3.0.1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-crossplane-credentials
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-crossplane-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        credentials: |
          {"client_id":"crossplane","client_secret":"{{ .clientSecret }}","url":"http://keycloak-service.keycloak.svc:8080","realm":"Platform"}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: platform/keycloak/crossplane
        property: client-secret
---
apiVersion: keycloak.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: platform-keycloak
spec:
  credentials:
    source: Secret
    secretRef:
      name: keycloak-crossplane-credentials
      namespace: crossplane-system
      key: credentials
