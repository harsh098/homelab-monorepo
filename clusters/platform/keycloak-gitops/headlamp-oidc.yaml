apiVersion: openidclient.keycloak.crossplane.io/v1alpha2
kind: Client
metadata:
  name: platform-headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: platform
spec:
  deletionPolicy: Orphan
  writeConnectionSecretToRef:
    name: headlamp-oidc-client
    namespace: keycloak
  forProvider:
    realmId: Platform
    clientId: headlamp
    name: Headlamp
    description: OIDC client for the Headlamp Kubernetes dashboard
    accessType: CONFIDENTIAL
    clientAuthenticatorType: client-secret
    enabled: true
    import: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    validRedirectUris:
      - https://headlamp.platform.home.arpa/oidc-callback
    validPostLogoutRedirectUris:
      - https://headlamp.platform.home.arpa/
    webOrigins:
      - https://headlamp.platform.home.arpa
  providerConfigRef:
    name: platform-keycloak
---
apiVersion: openidgroup.keycloak.crossplane.io/v1alpha1
kind: GroupMembershipProtocolMapper
metadata:
  name: platform-headlamp-groups
spec:
  deletionPolicy: Delete
  forProvider:
    realmId: Platform
    clientIdRef:
      name: platform-headlamp
      policy:
        resolve: Always
    name: groups
    claimName: groups
    fullPath: false
    addToIdToken: true
    addToAccessToken: true
    addToUserinfo: true
  providerConfigRef:
    name: platform-keycloak
