apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-secret-reader
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-secret-reader
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["headlamp-oidc-client"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-secret-reader
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: headlamp-secret-reader
    namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: keycloak-kubernetes
  namespace: keycloak
spec:
  provider:
    kubernetes:
      remoteNamespace: keycloak
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: headlamp-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc-push-source
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-kubernetes
    kind: SecretStore
  target:
    name: headlamp-oidc-push-source
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        key: headlamp-oidc-client
        property: clientSecret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: headlamp-oidc-client-to-openbao
  namespace: keycloak
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-push
      kind: ClusterSecretStore
  selector:
    secret:
      name: headlamp-oidc-push-source
  data:
    - match:
        secretKey: clientSecret
        remoteRef:
          remoteKey: platform/headlamp/oidc-client
          property: client-secret
