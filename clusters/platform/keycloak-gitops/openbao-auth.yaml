apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: openbao
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-external-secrets-token
          key: token
          namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-push
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: openbao
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-pushsecret-token
          key: token
          namespace: external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-external-secrets
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-external-secrets-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao-external-secrets
    namespace: external-secrets
