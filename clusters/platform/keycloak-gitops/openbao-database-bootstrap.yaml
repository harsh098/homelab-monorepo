apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-credentials-bootstrap
  namespace: external-secrets
  annotations:
    # The pod template is immutable on Jobs. Allow Flux to replace this fixed
    # bootstrap job when its declarative script changes.
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    app.kubernetes.io/name: keycloak-db-credentials-bootstrap
    app.kubernetes.io/part-of: keycloak
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-db-credentials-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openbao-external-secrets
      containers:
        - name: openbao
          image: openbao/openbao:2.6.2
          imagePullPolicy: IfNotPresent
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc:8200
            - name: BAO_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-bootstrap-token
                  key: token
            - name: BAO_EXTERNAL_SECRETS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-external-secrets-token
                  key: token
          volumeMounts:
            - name: homelab-ca
              mountPath: /etc/openbao-ca
              readOnly: true
          command:
            - /bin/sh
            - -ec
            - |
              export BAO_TOKEN="$BAO_BOOTSTRAP_TOKEN"
              until bao status >/dev/null 2>&1; do sleep 5; done
              token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              bao auth enable kubernetes >/dev/null 2>&1 || true
              bao write auth/kubernetes/config \
                token_reviewer_jwt="$token_reviewer_jwt" \
                kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}" \
                kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bao policy write platform-secrets - <<'EOF'
              path "openbao/data/platform/keycloak/database" {
                capabilities = ["read"]
              }
              path "openbao/data/platform/headlamp/oidc-client" {
                capabilities = ["read"]
              }
              path "openbao/data/platform/keycloak/crossplane" {
                capabilities = ["read"]
              }
              EOF
              bao policy write openbao-admin - <<'EOF'
              path "openbao/*" {
                capabilities = ["create", "read", "update", "delete", "list", "sudo"]
              }
              EOF
              bao policy write openbao-editor - <<'EOF'
              path "openbao/data/platform/*" {
                capabilities = ["create", "read", "update", "list"]
              }
              path "openbao/metadata/platform/*" {
                capabilities = ["read", "list"]
              }
              EOF
              bao policy write openbao-viewer - <<'EOF'
              path "openbao/data/platform/*" {
                capabilities = ["read", "list"]
              }
              path "openbao/metadata/platform/*" {
                capabilities = ["read", "list"]
              }
              EOF
              bao token create -id="$BAO_EXTERNAL_SECRETS_TOKEN" \
                -policy=platform-secrets -orphan -renewable=false >/dev/null 2>&1 || true
              bao write auth/oidc/role/admin \
                user_claim=sub groups_claim=groups \
                allowed_redirect_uris=https://openbao.platform.home.arpa/ui/vault/auth/oidc/oidc/callback \
                token_policies=openbao-admin
              bao write auth/oidc/role/editor \
                user_claim=sub groups_claim=groups \
                allowed_redirect_uris=https://openbao.platform.home.arpa/ui/vault/auth/oidc/oidc/callback \
                token_policies=openbao-editor
              bao write auth/oidc/role/viewer \
                user_claim=sub groups_claim=groups \
                allowed_redirect_uris=https://openbao.platform.home.arpa/ui/vault/auth/oidc/oidc/callback \
                token_policies=openbao-viewer
              bao write auth/kubernetes/role/external-secrets \
                bound_service_account_names=openbao-external-secrets \
                bound_service_account_namespaces=external-secrets \
                token_policies=platform-secrets \
                token_ttl=1h
              bao secrets enable -path=openbao kv-v2 >/dev/null 2>&1 || true
              if ! bao kv get -mount=openbao platform/keycloak/database >/dev/null 2>&1; then
                username=keycloak
                password="$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9_@%-' | cut -c1-40)"
                while [ "${#password}" -lt 32 ]; do
                  password="$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9_@%-' | cut -c1-40)"
                done
                bao kv put -mount=openbao platform/keycloak/database username="$username" password="$password"
              fi
              if ! bao kv get -mount=openbao platform/headlamp/oidc-client >/dev/null 2>&1; then
                client_secret="$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9_@%-' | cut -c1-64)"
                while [ "${#client_secret}" -lt 32 ]; do
                  client_secret="$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9_@%-' | cut -c1-64)"
                done
                bao kv put -mount=openbao platform/headlamp/oidc-client \
                  client-id=headlamp client-secret="$client_secret" \
                  issuer-url=https://keycloak.platform.home.arpa/realms/Platform \
                  scopes="openid,profile,email" \
                  callback-url=https://headlamp.platform.home.arpa/oidc-callback \
                  validator-client-id=headlamp \
                  validator-issuer-url=https://keycloak.platform.home.arpa/realms/Platform \
                  use-access-token=true use-pkce=true
              fi
              headlamp_client_secret="$(bao kv get -mount=openbao -field=client-secret platform/headlamp/oidc-client)"
              bao auth enable oidc >/dev/null 2>&1 || true
              bao write auth/oidc/config \
                oidc_discovery_url=https://keycloak.platform.home.arpa/realms/Platform \
                oidc_client_id=headlamp \
                oidc_client_secret="$headlamp_client_secret" \
                oidc_discovery_ca_pem="$(cat /etc/openbao-ca/ca.crt)" \
                default_role=homelab
              bao write auth/oidc/role/homelab \
                user_claim=sub \
                groups_claim=groups \
                allowed_redirect_uris=https://openbao.platform.home.arpa/ui/vault/auth/oidc/oidc/callback \
                oidc_scopes="openid,profile,email"
              if ! bao kv get -mount=openbao platform/keycloak/crossplane >/dev/null 2>&1; then
                client_secret="$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9_@%-' | cut -c1-64)"
                while [ "${#client_secret}" -lt 32 ]; do
                  client_secret="$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9_@%-' | cut -c1-64)"
                done
                bao kv put -mount=openbao platform/keycloak/crossplane client-secret="$client_secret"
              fi
      volumes:
        - name: homelab-ca
          secret:
            secretName: openbao-bootstrap-ca
