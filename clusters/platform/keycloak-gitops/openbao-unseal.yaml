apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-unseal-key
  namespace: openbao
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: openbao-unseal-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: unseal-key
      remoteRef:
        key: openbao-unseal-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-unsealer
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-unsealer
    app.kubernetes.io/part-of: openbao
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-unsealer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-unsealer
        app.kubernetes.io/part-of: openbao
    spec:
      automountServiceAccountToken: false
      containers:
        - name: unsealer
          image: openbao/openbao:2.6.2
          imagePullPolicy: IfNotPresent
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc:8200
            - name: BAO_UNSEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: openbao-unseal-key
                  key: unseal-key
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                set +e
                bao status >/dev/null 2>&1
                status="$?"
                set -e
                if [ "$status" -eq 2 ]; then
                  bao operator unseal "$BAO_UNSEAL_KEY" >/dev/null 2>&1 || true
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
