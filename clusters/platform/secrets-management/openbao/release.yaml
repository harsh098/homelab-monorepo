apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 24h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  chart:
    spec:
      chart: openbao
      version: 0.30.3
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
      interval: 24h
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    global:
      tlsDisable: true
    injector:
      enabled: false
    csi:
      enabled: false
    server:
      authDelegator:
        enabled: false
      dataStorage:
        enabled: true
        size: 8Gi
        storageClass: local-path-retain
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 768Mi
      ha:
        enabled: true
        replicas: 1
        disruptionBudget:
          enabled: false
        raft:
          enabled: true
          setNodeId: true
    ui:
      enabled: true
