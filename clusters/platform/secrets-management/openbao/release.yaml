apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 24h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  chart:
    spec:
      chart: openbao
      version: 0.30.3
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
      interval: 24h
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    global:
      tlsDisable: true
    injector:
      enabled: false
    csi:
      enabled: false
    server:
      authDelegator:
        enabled: true
      extraInitContainers:
        - name: prepare-kms-plugin-directory
          image: quay.io/openbao/openbao:2.7.1
          command: ["/bin/sh", "-ec"]
          args: ["mkdir -p /openbao/data/plugins"]
          volumeMounts:
            - name: data
              mountPath: /openbao/data
      volumes:
        - name: kms-credentials
          secret:
            secretName: openbao-kms-credentials
            defaultMode: 0440
      volumeMounts:
        - name: kms-credentials
          mountPath: /openbao/userconfig/gcp-kms
          readOnly: true
      dataStorage:
        enabled: true
        size: 8Gi
        storageClass: local-path-retain
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 768Mi
      ha:
        enabled: true
        replicas: 1
        disruptionBudget:
          enabled: false
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true
            plugin_directory = "/openbao/data/plugins"
            plugin_auto_download = true

            plugin "kms" "gcpckms" {
              image = "ghcr.io/openbao/openbao-plugin-kms-gcp:v0.1.0@sha256:ed0b6e44716dfb77286dc53e8ee2322e41c8e9b14d9652a20f71dd8384f31842"
            }

            seal "gcpckms" {
              credentials = "/openbao/userconfig/gcp-kms/credentials.json"
              project     = "learninggcp-470023"
              region      = "asia-south1"
              key_ring    = "openbao-unseal-in"
              crypto_key  = "openbao-unseal-in"
            }

            listener "tcp" {
              tls_disable     = 1
              address         = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "raft" {
              path = "/openbao/data"
            }

            service_registration "kubernetes" {}
    ui:
      enabled: true
